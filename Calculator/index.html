<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator | CodeAlpha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="stage">
    <section class="calc" aria-label="Calculator">
      <div class="calc-top">
        <span class="brand">Calc 02</span>
        <span class="solar" aria-hidden="true"></span>
      </div>

      <div class="screen" aria-live="polite">
        <div class="expr" id="expr"></div>
        <output class="value" id="value">0</output>
      </div>

      <div class="keys">
        <button type="button" class="key key-fn" data-action="clear" data-key="Escape"
          aria-label="All clear">AC</button>
        <button type="button" class="key key-fn" data-action="backspace" data-key="Backspace"
          aria-label="Delete last digit">&#9003;</button>
        <button type="button" class="key key-fn" data-action="percent" data-key="%" aria-label="Percent">%</button>
        <button type="button" class="key key-op" data-op="/" data-key="/" aria-label="Divide">&divide;</button>

        <button type="button" class="key" data-digit="7" data-key="7">7</button>
        <button type="button" class="key" data-digit="8" data-key="8">8</button>
        <button type="button" class="key" data-digit="9" data-key="9">9</button>
        <button type="button" class="key key-op" data-op="*" data-key="*" aria-label="Multiply">&times;</button>

        <button type="button" class="key" data-digit="4" data-key="4">4</button>
        <button type="button" class="key" data-digit="5" data-key="5">5</button>
        <button type="button" class="key" data-digit="6" data-key="6">6</button>
        <button type="button" class="key key-op" data-op="-" data-key="-" aria-label="Subtract">&minus;</button>

        <button type="button" class="key" data-digit="1" data-key="1">1</button>
        <button type="button" class="key" data-digit="2" data-key="2">2</button>
        <button type="button" class="key" data-digit="3" data-key="3">3</button>
        <button type="button" class="key key-op" data-op="+" data-key="+" aria-label="Add">+</button>

        <button type="button" class="key key-fn" data-action="sign" aria-label="Change sign">&plusmn;</button>
        <button type="button" class="key" data-digit="0" data-key="0">0</button>
        <button type="button" class="key" data-action="dot" data-key=".">.</button>
        <button type="button" class="key key-eq" data-action="equals" data-key="Enter" aria-label="Equals">=</button>
      </div>
    </section>

    <aside class="tape" aria-label="History">
      <div class="tape-head">
        <h2>History</h2>
        <button type="button" class="tape-clear" id="clearHistory">Clear</button>
      </div>
      <ol class="tape-list" id="history">
        <li class="tape-empty">Your calculations will show up here.</li>
      </ol>
      <p class="hint">Keyboard: 0-9, + - * /, Enter, Backspace, Esc</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>

</html>
